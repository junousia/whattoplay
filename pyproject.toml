[project]
name = "whattoplay"
version = "1.0.0"
description = "Pick what to play from the games you already own: pluggable store backends (Steam, Epic, plugins), play status tracking, deal lookup, JSON output for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jukka Nousiainen" }]
keywords = ["games", "backlog", "steam", "epic", "agent-skill", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
epic = ["legendary-gl>=0.20"]

[project.urls]
Homepage = "https://github.com/junousia/whattoplay"
Issues = "https://github.com/junousia/whattoplay/issues"

[project.scripts]
whattoplay = "whattoplay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "requests-mock>=1.12", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whattoplay"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
